<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Passaparola TV Studio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root { --ring-size: 260px; --node-size: 28px; --cam-size: 140px; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body { width: 100%; height: 100dvh; overflow: hidden; background: #070b16; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #studioCanvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
    .app-shell { position: relative; z-index: 1; width: 100%; height: 100dvh; display: flex; flex-direction: column; justify-content: space-between; padding: max(8px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom)); gap: 5px; overflow: hidden; }
    .top-bar, .stat-box, .qa-panel { background: rgba(13, 20, 38, 0.88); border: 1px solid rgba(255, 255, 255, 0.15); backdrop-filter: blur(12px); }
    .top-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; border-radius: 12px; padding: 6px 9px; flex-shrink: 0; }
    .brand { display: flex; align-items: center; gap: 7px; flex: 1; min-width: 0; }
    .brand-badge { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #f59e0b, #d97706); color: #090d16; font-weight: 900; font-size: 14px; display: grid; place-items: center; flex-shrink: 0; }
    .brand-title { font-size: 12px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand-sub { font-size: 9.5px; color: #fbbf24; font-weight: 700; }
    .top-actions { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .icon-btn { height: 30px; padding: 0 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.08); color: #f8fafc; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
    .icon-btn.accent { background: rgba(59,130,246,0.32); border-color: rgba(96,165,250,0.55); color: #dbeafe; }
    .stats-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; flex-shrink: 0; }
    .stat-box { border-radius: 10px; padding: 3px 4px; text-align: center; }
    .stat-label { font-size: 8.5px; font-weight: 800; color: #94a3b8; }
    .stat-val { font-size: 14px; font-weight: 900; line-height: 1.15; }
    .stage-zone { position: relative; flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .wheel-assembly { position: relative; width: var(--ring-size); height: var(--ring-size); display: flex; align-items: center; justify-content: center; }
    .center-cam-wrap { position: relative; width: var(--cam-size); height: var(--cam-size); border-radius: 50%; overflow: hidden; border: 3px solid rgba(251,191,36,0.92); box-shadow: 0 0 24px rgba(56,189,248,0.35), inset 0 0 16px rgba(0,0,0,0.72); background: radial-gradient(circle at 30% 25%, #1e293b, #090d16 78%); z-index: 2; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    #contestantVideo { width: 100%; height: 100%; object-fit: cover; display: none; }
    #contestantVideo.active { display: block; }
    #contestantVideo.mirrored { transform: scaleX(-1); }
    .cam-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #cbd5e1; text-align: center; padding: 6px; }
    .cam-placeholder i { font-size: 22px; color: #fbbf24; }
    .cam-placeholder span { font-size: 10px; font-weight: 700; line-height: 1.2; }
    .letter-node { position: absolute; left: 50%; top: 50%; width: var(--node-size); height: var(--node-size); margin-left: calc(var(--node-size) / -2); margin-top: calc(var(--node-size) / -2); border-radius: 50%; border: 2px solid rgba(147,197,253,0.7); background: linear-gradient(145deg, #1d4ed8, #1e3a8a); color: #fff; font-weight: 900; font-size: calc(var(--node-size) * 0.44); display: grid; place-items: center; cursor: pointer; z-index: 5; box-shadow: 0 3px 8px rgba(0,0,0,0.5); transition: transform 0.14s ease, background 0.14s ease; }
    .letter-node.current { background: linear-gradient(135deg, #fde047, #f59e0b); color: #090d16; border-color: #fff; z-index: 7; box-shadow: 0 0 16px rgba(251,191,36,0.95); }
    .letter-node.correct { background: linear-gradient(135deg, #34d399, #059669); border-color: #a7f3d0; color: #042f2e; }
    .letter-node.wrong { background: linear-gradient(135deg, #f87171, #dc2626); border-color: #fecaca; color: #fff; }
    .letter-node.passed { background: linear-gradient(135deg, #fb923c, #ea580c); border-color: #fed7aa; color: #fff7ed; }
    .qa-panel { border-radius: 13px; padding: 7px 10px; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
    .qa-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .active-letter-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 800; color: #fbbf24; }
    .letter-pill { width: 22px; height: 22px; border-radius: 6px; background: #f59e0b; color: #090d16; font-weight: 900; font-size: 12.5px; display: grid; place-items: center; }
    .qa-nav-group { display: inline-flex; align-items: center; gap: 4px; }
    .mini-nav-btn, .toggle-ans-btn { border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.08); color: #f8fafc; border-radius: 7px; padding: 4px 8px; font-size: 11px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
    .toggle-ans-btn { border-color: rgba(251,191,36,0.45); background: rgba(245,158,11,0.16); color: #fde68a; }
    .question-text { font-size: 13px; font-weight: 700; line-height: 1.28; color: #f8fafc; min-height: 30px; display: flex; align-items: center; }
    .answer-row { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 7px; background: rgba(16,185,129,0.14); border: 1px solid rgba(16,185,129,0.32); font-size: 11.5px; }
    .answer-lbl { font-weight: 800; color: #6ee7b7; flex-shrink: 0; }
    .answer-val { font-weight: 800; color: #fff; }
    .answer-val.hidden-ans { filter: blur(6px); opacity: 0.45; }
    .decision-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; flex-shrink: 0; }
    .dec-btn { border: none; border-radius: 10px; padding: 9px 5px; font-size: 12.5px; font-weight: 900; color: #fff; display: flex; align-items: center; justify-content: center; gap: 5px; cursor: pointer; }
    .dec-btn:active, .sub-btn:active { transform: scale(0.96); }
    .dec-btn.ok { background: linear-gradient(135deg, #10b981, #047857); }
    .dec-btn.no { background: linear-gradient(135deg, #ef4444, #b91c1c); }
    .dec-btn.ps { background: linear-gradient(135deg, #f97316, #c2410c); }
    .bottom-controls { display: flex; flex-direction: column; gap: 5px; flex-shrink: 0; }
    .ctrl-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    .sub-btn { border: 1px solid rgba(255,255,255,0.16); background: rgba(15,23,42,0.92); color: #e2e8f0; border-radius: 9px; padding: 7px 4px; font-size: 10.5px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer; white-space: nowrap; }
    .sub-btn.start { background: linear-gradient(135deg, #f59e0b, #d97706); color: #090d16; border: none; }
    .sub-btn.rec { background: linear-gradient(135deg, #e11d48, #9f1239); color: #fff; border: none; }
    .sub-btn.rec.recording { animation: pulseRec 1.1s infinite; }
    @keyframes pulseRec { 0%,100% { box-shadow: 0 0 0 0 rgba(225,29,72,0.7); } 50% { box-shadow: 0 0 0 7px rgba(225,29,72,0); } }
    body.clean-hud .top-bar, body.clean-hud .stats-strip, body.clean-hud .decision-grid, body.clean-hud .bottom-controls { display: none !important; }
    .restore-hud-btn { display: none; position: fixed; top: max(10px, env(safe-area-inset-top)); right: 10px; z-index: 40; border: 1px solid rgba(255,255,255,0.3); background: rgba(15,23,42,0.85); color: #fff; padding: 6px 11px; border-radius: 999px; font-size: 11px; font-weight: 800; align-items: center; gap: 5px; cursor: pointer; }
    body.clean-hud .restore-hud-btn { display: inline-flex; }
    .modal-backdrop { display: none; position: fixed; inset: 0; z-index: 60; background: rgba(2,6,23,0.86); backdrop-filter: blur(6px); align-items: center; justify-content: center; padding: 12px; }
    .modal-backdrop.open { display: flex; }
    .modal-card { width: 100%; max-width: 620px; max-height: 85dvh; background: #0f172a; border: 1px solid rgba(255,255,255,0.16); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; }
    .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 11px 14px; border-bottom: 1px solid rgba(255,255,255,0.1); background: rgba(30,41,59,0.65); }
    .modal-head h3 { font-size: 14px; font-weight: 800; }
    .close-x { width: 30px; height: 30px; border-radius: 8px; border: none; background: rgba(255,255,255,0.1); color: #fff; font-size: 15px; cursor: pointer; }
    .modal-body { padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .editor-item { background: rgba(30,41,59,0.55); border: 1px solid rgba(255,255,255,0.1); border-radius: 11px; padding: 9px; display: flex; flex-direction: column; gap: 6px; }
    .editor-item.disabled-letter { opacity: 0.55; }
    .editor-top { display: flex; align-items: center; justify-content: space-between; }
    .editor-letter { font-weight: 900; color: #fbbf24; font-size: 13px; }
    .check-label { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; cursor: pointer; }
    .modal-input, .modal-textarea { width: 100%; border-radius: 8px; border: 1px solid rgba(255,255,255,0.18); background: #090d16; color: #f8fafc; padding: 7px 9px; font-size: 12px; font-family: inherit; }
    .modal-textarea { min-height: 46px; resize: vertical; }
    .modal-foot { display: flex; flex-wrap: wrap; gap: 7px; padding: 10px 14px; border-top: 1px solid rgba(255,255,255,0.1); background: rgba(15,23,42,0.95); justify-content: flex-end; }
    .act-btn { border: none; border-radius: 9px; padding: 9px 12px; font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: #fff; }
    .act-btn.primary { background: #2563eb; } .act-btn.success { background: #059669; } .act-btn.warn { background: #d97706; color: #090d16; } .act-btn.muted { background: #475569; }
    #previewVideo { width: 100%; max-height: 40dvh; border-radius: 10px; background: #000; }
    .toast { position: fixed; bottom: 85px; left: 50%; transform: translateX(-50%); z-index: 80; background: rgba(15,23,42,0.96); border: 1px solid rgba(251,191,36,0.55); color: #fef3c7; padding: 7px 14px; border-radius: 999px; font-size: 11.5px; font-weight: 800; opacity: 0; pointer-events: none; transition: opacity 0.2s; white-space: nowrap; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <canvas id="studioCanvas"></canvas>
  <button id="restoreHudBtn" class="restore-hud-btn" type="button"><i class="fa-solid fa-eye"></i> Kontrolleri Aç</button>

  <div class="app-shell">
    <header class="top-bar">
      <div class="brand">
        <div class="brand-badge">P</div>
        <div>
          <div class="brand-title">PASSAPAROLA TV STUDIO</div>
          <div class="brand-sub" id="activeCountLabel">23 Aktif Harf • v3</div>
        </div>
      </div>
      <div class="top-actions">
        <button id="editBtn" class="icon-btn accent" type="button"><i class="fa-solid fa-pen-to-square"></i> Harf / Soru</button>
        <button id="pdfBtn" class="icon-btn" type="button"><i class="fa-solid fa-file-pdf"></i> PDF</button>
        <button id="cleanBtn" class="icon-btn" type="button"><i class="fa-solid fa-eye-slash"></i></button>
      </div>
    </header>

    <section class="stats-strip">
      <div class="stat-box"><div class="stat-label">KALAN SÜRE</div><div class="stat-val" style="color:#fbbf24" id="timerVal">120</div></div>
      <div class="stat-box"><div class="stat-label">DOĞRU</div><div class="stat-val" style="color:#34d399" id="correctVal">0</div></div>
      <div class="stat-box"><div class="stat-label">YANLIŞ</div><div class="stat-val" style="color:#f87171" id="wrongVal">0</div></div>
      <div class="stat-box"><div class="stat-label">PAS</div><div class="stat-val" style="color:#fb923c" id="passVal">0</div></div>
    </section>

    <main class="stage-zone" id="stageZone">
      <div class="wheel-assembly" id="wheelAssembly">
        <div class="center-cam-wrap" id="centerCamWrap">
          <video id="contestantVideo" autoplay playsinline muted class="mirrored"></video>
          <div class="cam-placeholder" id="camPlaceholder"><i class="fa-solid fa-video"></i><span>Kamerayı Açmak İçin<br/>Dokunun</span></div>
        </div>
      </div>
    </main>

    <section class="qa-panel">
      <div class="qa-top">
        <div class="active-letter-tag"><span class="letter-pill" id="activeLetterBadge">A</span><span id="questionIndexLabel">Soru 1 / 23</span></div>
        <div class="qa-nav-group">
          <button id="prevStepBtn" class="mini-nav-btn" type="button"><i class="fa-solid fa-chevron-left"></i></button>
          <button id="nextStepBtn" class="mini-nav-btn" type="button"><i class="fa-solid fa-chevron-right"></i></button>
          <button id="toggleAnswerBtn" class="toggle-ans-btn" type="button"><i class="fa-solid fa-eye" id="ansEyeIcon"></i><span id="ansToggleText">Cevabı Göster</span></button>
        </div>
      </div>
      <div class="question-text" id="questionText">Öğretmenden olanının iyi olduğuna inanılan şey?</div>
      <div class="answer-row"><span class="answer-lbl">CEVAP:</span><span class="answer-val hidden-ans" id="answerText">Araba</span></div>
    </section>

    <section class="decision-grid">
      <button id="correctBtn" class="dec-btn ok" type="button"><i class="fa-solid fa-check"></i> DOĞRU</button>
      <button id="wrongBtn" class="dec-btn no" type="button"><i class="fa-solid fa-xmark"></i> YANLIŞ</button>
      <button id="passBtn" class="dec-btn ps" type="button"><i class="fa-solid fa-forward"></i> PAS</button>
    </section>

    <footer class="bottom-controls">
      <div class="ctrl-row">
        <button id="startStopGameBtn" class="sub-btn start" type="button"><i class="fa-solid fa-play"></i> Başlat</button>
        <button id="resetGameBtn" class="sub-btn" type="button"><i class="fa-solid fa-rotate-left"></i> Sıfırla</button>
        <button id="toggleCamBtn" class="sub-btn" type="button"><i class="fa-solid fa-camera"></i> Kamera Aç</button>
        <button id="flipCamBtn" class="sub-btn" type="button"><i class="fa-solid fa-arrows-rotate"></i> Ön/Arka</button>
      </div>
      <div class="ctrl-row" style="grid-template-columns: 1fr 1fr;">
        <button id="recordBtn" class="sub-btn rec" type="button"><i class="fa-solid fa-circle"></i> TV Kaydı Başlat</button>
        <button id="openPreviewBtn" class="sub-btn" type="button"><i class="fa-solid fa-film"></i> Son Kaydı İndir</button>
      </div>
    </footer>
  </div>

  <div class="toast" id="toast"></div>

  <div class="modal-backdrop" id="editorModal">
    <div class="modal-card">
      <div class="modal-head"><h3>Soruları Düzenle ve Harf Çıkar/Ekle</h3><button class="close-x" id="closeEditorBtn" type="button">&times;</button></div>
      <div class="modal-body" id="editorList"></div>
      <div class="modal-foot">
        <button class="act-btn muted" id="resetDefaultQBtn" type="button">Varsayılan 23 Soru</button>
        <button class="act-btn success" id="saveEditorBtn" type="button">Kaydet ve Çarkı Güncelle</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="previewModal">
    <div class="modal-card">
      <div class="modal-head"><h3>Kaydedilen TV Videosu</h3><button class="close-x" id="closePreviewBtn" type="button">&times;</button></div>
      <div class="modal-body">
        <video id="previewVideo" controls playsinline></video>
        <div id="videoMetaInfo" style="font-size:11.5px; color:#cbd5e1;">Henüz kayıt alınmadı.</div>
      </div>
      <div class="modal-foot">
        <button class="act-btn primary" id="downloadVideoBtn" type="button"><i class="fa-solid fa-download"></i> Cihaza İndir</button>
        <button class="act-btn success" id="shareVideoBtn" type="button"><i class="fa-solid fa-share-nodes"></i> Galeri / Paylaş</button>
        <button class="act-btn warn" id="openTabVideoBtn" type="button"><i class="fa-solid fa-up-right-from-square"></i> Yeni Sekmede Aç</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "passaparola_teacher_23_v3";
    const DEFAULT_ITEMS = [
      { letter: "A", q: "Öğretmenden olanının iyi olduğuna inanılan şey?", a: "Araba", active: true },
      { letter: "B", q: "Herkesin favori dersi", a: "Beden eğitimi", active: true },
      { letter: "C", q: "Hayatta bir amacı olmayan mutsuz insanların hezeyanları uğraşmaktan gerçek görevlerini yapamayan kurum", a: "CİMER", active: true },
      { letter: "Ç", q: "Çarkta kullanılmayan harf", a: "", active: false },
      { letter: "D", q: "Hiçbir zaman hiçbir yerde herkesi mutlu edemeyecek çizelge", a: "Ders programı", active: true },
      { letter: "E", q: "Yokluğu öldürmeyen varlığı güldürmeyen çoğu zaman zamanında gelmeyen şey", a: "Ek ders", active: true },
      { letter: "F", q: "Öğretmenleri okulda duyduklarında mutlu eden okul dışında duyduklarında mutsuz eden şey", a: "Fulledim hocam", active: true },
      { letter: "G", q: "Öğretmenleri canından bezdiren evrak", a: "Gelişim raporu", active: true },
      { letter: "Ğ", q: "Çarkta kullanılmayan harf", a: "", active: false },
      { letter: "H", q: "Tam her şey yoluna girmişken bütün planları altüst eden şey", a: "Hizmetiçi Eğitim", active: true },
      { letter: "I", q: "Çarkta kullanılmayan harf", a: "", active: false },
      { letter: "İ", q: "Öğrenciler tarafından bütün öğretmenlerin bildiği düşünülen şey ama aslında öyle olmayan şey", a: "İmla noktalama", active: true },
      { letter: "J", q: "Her gelen bir öncekinden daha kötüymüş izlenimi veren topluluk", a: "Jenerasyon", active: true },
      { letter: "K", q: "Adı değişse de hayatımızdan bir türlü çıkmayan minik haylazlar", a: "Kazanım", active: true },
      { letter: "L", q: "Çarkta kullanılmayan harf", a: "", active: false },
      { letter: "M", q: "Öğretmen olmayanların dilinden düşürmediği ama öğretmenlerin elinden çabucak uçup giden halk efsanesi", a: "Maaş", active: true },
      { letter: "N", q: "Öğretmenin bitmeyen çilesi evlat olsa sevilmeyeni", a: "Nöbet", active: true },
      { letter: "O", q: "Çarkta kullanılmayan harf", a: "", active: false },
      { letter: "Ö", q: "Öğrenciye bir şey öğretmenin önündeki en büyük engel", a: "Öğrenilmiş çaresizlik", active: true },
      { letter: "P", q: "Öğretmeni canından bezdirmek için üretilmiş angarya bütünü", a: "Proje", active: true },
      { letter: "R", q: "Öğrencilere yönelik olan ama aslında velilerin ihtiyaç duyduğu şey", a: "Rehberlik", active: true },
      { letter: "S", q: "Öğretmenin elinde kalan tek özgürlüğü", a: "Sözlü notu", active: true },
      { letter: "Ş", q: "Öğretmenliğin şanındandır", a: "Şikayet", active: true },
      { letter: "T", q: "Müdürün öğretmenleri gaza getirmek için verdiği belge", a: "Teşekkür belgesi", active: true },
      { letter: "U", q: "Disiplin kurulunda ceza veriyormuş gibi yapmak", a: "Uyarmak", active: true },
      { letter: "Ü", q: "Çarkta kullanılmayan harf", a: "", active: false },
      { letter: "V", q: "Öğrencilerin olumlu veya olumsuz davranışlarının gerçek olarak gözlemlenebilen an", a: "Veli toplantısı", active: true },
      { letter: "Y", q: "Öğretmenlerin en çok yaptığı düşünülen eylem", a: "Yan gelip yatmak", active: true },
      { letter: "Z", q: "Okulda bazen hemen duyulmak istenen bazen hiç duyulmak istenmeyen ses", a: "Zil", active: true }
    ];

    const cloneDefaults = () => DEFAULT_ITEMS.map(d => ({ ...d }));
    function loadQuestions() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const p = raw ? JSON.parse(raw) : null;
        if (Array.isArray(p) && p.length === DEFAULT_ITEMS.length) return p;
      } catch (e) {}
      return cloneDefaults();
    }
    const saveQuestions = (d) => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch (e) {} };

    let items = loadQuestions(), statuses = {}, currentIndex = 0, answerVisible = false, timeLeft = 120, gameRunning = false, timerInterval = null;
    let camStream = null, micOnlyStream = null, useFrontCam = true;
    let audioCtx = null, masterGain = null, recordAudioDest = null, micSourceNode = null, keepAliveStarted = false;
    let mediaRecorder = null, recordedChunks = [], lastVideoBlob = null, lastVideoUrl = null, lastVideoMime = "video/webm";

    const $ = (id) => document.getElementById(id);
    function showToast(msg) {
      const t = $("toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => t.classList.remove("show"), 2200);
    }

    function ensureAudioMixer() {
      try {
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return null;
          audioCtx = new Ctx();
          masterGain = audioCtx.createGain();
          masterGain.gain.value = 0.9;
          masterGain.connect(audioCtx.destination);
          if (audioCtx.createMediaStreamDestination) {
            recordAudioDest = audioCtx.createMediaStreamDestination();
            masterGain.connect(recordAudioDest);
            if (!keepAliveStarted) {
              keepAliveStarted = true;
              const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
              g.gain.value = 0.00005;
              osc.connect(g); g.connect(recordAudioDest); osc.start();
            }
          }
        }
        if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
        const s = camStream || micOnlyStream;
        if (s && recordAudioDest && !micSourceNode && s.getAudioTracks().length) {
          micSourceNode = audioCtx.createMediaStreamSource(new MediaStream([s.getAudioTracks()[0]]));
          micSourceNode.connect(recordAudioDest);
        }
        return audioCtx;
      } catch (e) { return null; }
    }

    function playTone(freq, off, dur, type = "triangle", peak = 0.45) {
      const ctx = ensureAudioMixer();
      if (!ctx || !masterGain) return;
      const now = ctx.currentTime + off, osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = type; osc.frequency.setValueAtTime(freq, now);
      g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(peak, now + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.connect(g); g.connect(masterGain); osc.start(now); osc.stop(now + dur + 0.03);
    }

    function playSfx(kind) {
      if (kind === "correct") { playTone(523.25, 0, 0.14); playTone(659.25, 0.11, 0.14); playTone(783.99, 0.22, 0.16); playTone(1046.5, 0.34, 0.32, "sine", 0.55); }
      else if (kind === "wrong") { playTone(155, 0, 0.24, "sawtooth", 0.5); playTone(130, 0.22, 0.34, "sawtooth", 0.55); }
      else if (kind === "pass") { playTone(440, 0, 0.12, "sine", 0.35); playTone(587.33, 0.09, 0.16, "sine", 0.35); }
    }

    const getActiveItems = () => items.filter(it => it && it.active);

    function layoutWheel() {
      const stage = $("stageZone"), wheel = $("wheelAssembly");
      const rect = stage.getBoundingClientRect();
      const minSide = Math.max(170, Math.min(rect.width || window.innerWidth - 20, rect.height || window.innerHeight * 0.36) - 6);
      const ringSize = Math.min(minSide, 410);
      const nodeSize = Math.max(22, Math.min(35, Math.round(ringSize * 0.104)));
      const camSize = Math.max(82, Math.round(ringSize - nodeSize * 3.1));
      document.documentElement.style.setProperty("--ring-size", ringSize + "px");
      document.documentElement.style.setProperty("--node-size", nodeSize + "px");
      document.documentElement.style.setProperty("--cam-size", camSize + "px");

      const active = getActiveItems();
      const radius = ringSize / 2 - nodeSize / 2 - 2;
      wheel.querySelectorAll(".letter-node").forEach(n => n.remove());

      active.forEach((item, idx) => {
        const ang = ((idx / Math.max(1, active.length)) * 360 - 90) * (Math.PI / 180);
        const x = Math.cos(ang) * radius, y = Math.sin(ang) * radius;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "letter-node" + (idx === currentIndex ? " current" : "") + (statuses[item.letter] ? " " + statuses[item.letter] : "");
        btn.textContent = item.letter;
        btn.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)${idx === currentIndex ? " scale(1.18)" : ""}`;
        btn.onclick = () => { currentIndex = idx; answerVisible = false; renderAll(); };
        wheel.appendChild(btn);
      });
    }

    function renderAll() {
      const active = getActiveItems();
      if (!active.length) {
        currentIndex = 0;
        $("activeCountLabel").textContent = "0 Aktif Harf • v3";
        $("activeLetterBadge").textContent = "-";
        $("questionIndexLabel").textContent = "Harf Seçilmedi";
        $("questionText").textContent = "Harf / Soru menüsünden en az bir harfi aktif yapın.";
        $("answerText").textContent = "-";
        layoutWheel();
        return;
      }
      currentIndex = ((currentIndex % active.length) + active.length) % active.length;
      const cur = active[currentIndex];
      $("activeCountLabel").textContent = `${active.length} Aktif Harf • v3`;
      $("activeLetterBadge").textContent = cur.letter;
      $("questionIndexLabel").textContent = `Soru ${currentIndex + 1} / ${active.length}`;
      $("questionText").textContent = cur.q || "(Soru girilmemiş)";
      $("answerText").textContent = cur.a || "(Cevap girilmemiş)";
      $("answerText").classList.toggle("hidden-ans", !answerVisible);
      $("ansToggleText").textContent = answerVisible ? "Cevabı Gizle" : "Cevabı Göster";
      $("ansEyeIcon").className = answerVisible ? "fa-solid fa-eye-slash" : "fa-solid fa-eye";

      $("timerVal").textContent = timeLeft;
      let ok = 0, no = 0, ps = 0;
      active.forEach(it => { if (statuses[it.letter] === "correct") ok++; else if (statuses[it.letter] === "wrong") no++; else if (statuses[it.letter] === "passed") ps++; });
      $("correctVal").textContent = ok; $("wrongVal").textContent = no; $("passVal").textContent = ps;
      layoutWheel();
    }

    function handleDecision(kind) {
      const active = getActiveItems();
      if (!active.length) return;
      statuses[active[currentIndex].letter] = kind;
      playSfx(kind);
      for (let s = 1; s <= active.length; s++) {
        const cand = (currentIndex + s) % active.length;
        const st = statuses[active[cand].letter];
        if (st !== "correct" && st !== "wrong") { currentIndex = cand; answerVisible = false; renderAll(); return; }
      }
      currentIndex = (currentIndex + 1) % active.length;
      answerVisible = false;
      renderAll();
      showToast("Tüm harfler tamamlandı!");
    }

    $("correctBtn").onclick = () => handleDecision("correct");
    $("wrongBtn").onclick = () => handleDecision("wrong");
    $("passBtn").onclick = () => handleDecision("passed");
    $("prevStepBtn").onclick = () => { currentIndex--; answerVisible = false; renderAll(); };
    $("nextStepBtn").onclick = () => { currentIndex++; answerVisible = false; renderAll(); };
    $("toggleAnswerBtn").onclick = () => { answerVisible = !answerVisible; renderAll(); };

    function stopGame() {
      gameRunning = false;
      clearInterval(timerInterval);
      $("startStopGameBtn").innerHTML = `<i class="fa-solid fa-play"></i> Başlat`;
    }
    $("startStopGameBtn").onclick = () => {
      if (gameRunning) { stopGame(); return; }
      ensureAudioMixer();
      gameRunning = true;
      $("startStopGameBtn").innerHTML = `<i class="fa-solid fa-pause"></i> Duraklat`;
      timerInterval = setInterval(() => {
        timeLeft--;
        $("timerVal").textContent = timeLeft;
        if (timeLeft <= 0) { timeLeft = 0; stopGame(); showToast("Süre doldu!"); }
      }, 1000);
    };
    $("resetGameBtn").onclick = () => { stopGame(); statuses = {}; currentIndex = 0; answerVisible = false; timeLeft = 120; renderAll(); showToast("Oyun sıfırlandı"); };

    const videoEl = $("contestantVideo");
    function stopCamera() {
      if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
      if (micSourceNode) { try { micSourceNode.disconnect(); } catch (e) {} micSourceNode = null; }
      videoEl.srcObject = null; videoEl.classList.remove("active");
      $("camPlaceholder").style.display = "flex";
      $("toggleCamBtn").innerHTML = `<i class="fa-solid fa-camera"></i> Kamera Aç`;
    }
    async function startCamera() {
      stopCamera();
      try {
        camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: useFrontCam ? "user" : "environment" }, audio: true });
        videoEl.srcObject = camStream;
        videoEl.classList.add("active");
        videoEl.classList.toggle("mirrored", useFrontCam);
        $("camPlaceholder").style.display = "none";
        $("toggleCamBtn").innerHTML = `<i class="fa-solid fa-video-slash"></i> Kapat`;
        ensureAudioMixer();
        showToast(useFrontCam ? "Ön kamera açıldı" : "Arka kamera açıldı");
      } catch (e) { showToast("Kamera izni verilmedi"); }
    }
    $("toggleCamBtn").onclick = () => camStream ? stopCamera() : startCamera();
    $("centerCamWrap").onclick = () => { if (!camStream) startCamera(); else { useFrontCam = !useFrontCam; startCamera(); } };
    $("flipCamBtn").onclick = () => { useFrontCam = !useFrontCam; if (camStream) startCamera(); else showToast(useFrontCam ? "Ön kamera seçildi" : "Arka kamera seçildi"); };

    const toggleClean = () => { document.body.classList.toggle("clean-hud"); setTimeout(layoutWheel, 60); };
    $("cleanBtn").onclick = toggleClean;
    $("restoreHudBtn").onclick = toggleClean;

    const studioCanvas = $("studioCanvas"), sCtx = studioCanvas.getContext("2d");
    const recCanvas = document.createElement("canvas"); recCanvas.width = 720; recCanvas.height = 1280;
    const rCtx = recCanvas.getContext("2d");

    function drawStudio(ctx, w, h, t) {
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, "#081229"); g.addColorStop(0.55, "#0b1733"); g.addColorStop(1, "#050811");
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      [{ x: w * 0.2, c: "rgba(56,189,248,0.22)", p: 0 }, { x: w * 0.5, c: "rgba(251,191,36,0.2)", p: 1.7 }, { x: w * 0.8, c: "rgba(129,140,248,0.22)", p: 3.3 }].forEach(b => {
        ctx.save(); ctx.translate(b.x, 0); ctx.rotate(Math.sin(t * 0.0011 + b.p) * 0.34);
        const cone = ctx.createLinearGradient(0, 0, 0, h * 0.85);
        cone.addColorStop(0, b.c); cone.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = cone; ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(18, 0); ctx.lineTo(w * 0.26, h * 0.85); ctx.lineTo(-w * 0.26, h * 0.85); ctx.fill(); ctx.restore();
      });
    }

    function drawRecFrame(ctx, w, h, t) {
      drawStudio(ctx, w, h, t);
      const cx = w / 2, cy = h * 0.43, rR = w * 0.38, cR = rR * 0.54;
      ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, cR, 0, Math.PI * 2); ctx.clip();
      if (camStream && videoEl.readyState >= 2) {
        ctx.save(); ctx.translate(cx, cy); if (useFrontCam) ctx.scale(-1, 1);
        const vw = videoEl.videoWidth || 640, vh = videoEl.videoHeight || 480, sc = Math.max((cR * 2) / vw, (cR * 2) / vh);
        ctx.drawImage(videoEl, -(vw * sc) / 2, -(vh * sc) / 2, vw * sc, vh * sc); ctx.restore();
      } else {
        ctx.fillStyle = "#0f172a"; ctx.fillRect(cx - cR, cy - cR, cR * 2, cR * 2);
        ctx.fillStyle = "#fbbf24"; ctx.font = "bold 32px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("TV STÜDYO", cx, cy);
      }
      ctx.restore();
      ctx.strokeStyle = "rgba(251,191,36,0.85)"; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(cx, cy, cR, 0, Math.PI * 2); ctx.stroke();

      const active = getActiveItems();
      active.forEach((it, idx) => {
        const ang = ((idx / Math.max(1, active.length)) * 360 - 90) * (Math.PI / 180);
        const nx = cx + Math.cos(ang) * rR, ny = cy + Math.sin(ang) * rR, st = statuses[it.letter];
        ctx.fillStyle = idx === currentIndex ? "#fbbf24" : st === "correct" ? "#10b981" : st === "wrong" ? "#ef4444" : st === "passed" ? "#f97316" : "#1e40af";
        ctx.beginPath(); ctx.arc(nx, ny, idx === currentIndex ? 29 : 24, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = idx === currentIndex ? "#090d16" : "#fff";
        ctx.font = "900 23px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(it.letter, nx, ny + 1);
      });

      if (active.length) {
        const cur = active[currentIndex] || active[0], cX = 32, cY = h - 244, cW = w - 64, cH = 190;
        ctx.fillStyle = "rgba(10,16,32,0.9)"; ctx.strokeStyle = "rgba(251,191,36,0.6)"; ctx.lineWidth = 2;
        ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(cX, cY, cW, cH, 20); else ctx.rect(cX, cY, cW, cH); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#fbbf24"; ctx.font = "900 24px sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "top";
        ctx.fillText(`${cur.letter} HARFİ  •  SÜRE: ${timeLeft}sn`, cX + 20, cY + 16);
        ctx.fillStyle = "#f8fafc"; ctx.font = "700 22px sans-serif";
        let line = "", ly = cY + 52;
        String(cur.q || "").split(" ").forEach(word => {
          if (ctx.measureText(line + word).width > cW - 40 && line) { ctx.fillText(line.trim(), cX + 20, ly); line = word + " "; ly += 28; }
          else line += word + " ";
        });
        if (line.trim()) ctx.fillText(line.trim(), cX + 20, ly);
        if (answerVisible && cur.a) { ctx.fillStyle = "#34d399"; ctx.font = "800 21px sans-serif"; ctx.fillText(`CEVAP: ${cur.a}`, cX + 20, cY + cH - 36); }
      }
    }

    function loop(now) {
      const dpr = Math.min(window.devicePixelRatio || 1, 2), cw = window.innerWidth, ch = window.innerHeight;
      if (studioCanvas.width !== Math.round(cw * dpr) || studioCanvas.height !== Math.round(ch * dpr)) { studioCanvas.width = Math.round(cw * dpr); studioCanvas.height = Math.round(ch * dpr); }
      sCtx.save(); sCtx.scale(dpr, dpr); drawStudio(sCtx, cw, ch, now || 0); sCtx.restore();
      if (mediaRecorder && mediaRecorder.state === "recording") drawRecFrame(rCtx, 720, 1280, now || 0);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    $("recordBtn").onclick = async () => {
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        $("recordBtn").classList.remove("recording");
        $("recordBtn").innerHTML = `<i class="fa-solid fa-circle"></i> TV Kaydı Başlat`;
        return;
      }
      if (!window.MediaRecorder || !recCanvas.captureStream) { showToast("Tarayıcı kaydı desteklemiyor"); return; }
      if (!camStream && !micOnlyStream && navigator.mediaDevices) { try { micOnlyStream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) {} }
      ensureAudioMixer();
      const tracks = [...recCanvas.captureStream(30).getVideoTracks()];
      if (recordAudioDest) tracks.push(...recordAudioDest.stream.getAudioTracks());
      const mime = ["video/mp4", "video/webm;codecs=vp8,opus", "video/webm"].find(m => MediaRecorder.isTypeSupported(m)) || "";
      lastVideoMime = mime || "video/webm";
      recordedChunks = [];
      mediaRecorder = mime ? new MediaRecorder(new MediaStream(tracks), { mimeType: mime }) : new MediaRecorder(new MediaStream(tracks));
      mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: lastVideoMime });
        if (!blob.size) { showToast("Kayıt verisi oluşmadı"); return; }
        lastVideoBlob = blob;
        if (lastVideoUrl) URL.revokeObjectURL(lastVideoUrl);
        lastVideoUrl = URL.createObjectURL(blob);
        $("previewVideo").src = lastVideoUrl;
        $("videoMetaInfo").textContent = `Format: ${lastVideoMime} • Boyut: ${(blob.size / 1048576).toFixed(2)} MB`;
        $("previewModal").classList.add("open");
        showToast("TV kaydı tamamlandı!");
      };
      mediaRecorder.start(400);
      $("recordBtn").classList.add("recording");
      $("recordBtn").innerHTML = `<i class="fa-solid fa-stop"></i> Kaydı Durdur`;
      showToast("TV kaydı başladı (sesler dahil)");
    };

    $("openPreviewBtn").onclick = () => { if (!lastVideoUrl) { showToast("Henüz kayıt yok"); return; } $("previewVideo").src = lastVideoUrl; $("previewModal").classList.add("open"); };
    $("closePreviewBtn").onclick = () => $("previewModal").classList.remove("open");
    $("downloadVideoBtn").onclick = () => {
      if (!lastVideoBlob) return;
      const fn = `passaparola_tv.${lastVideoMime.includes("mp4") ? "mp4" : "webm"}`;
      const a = document.createElement("a"); a.href = lastVideoUrl; a.download = fn; document.body.appendChild(a); a.click(); a.remove();
      showToast("Cihaza indiriliyor...");
    };
    $("shareVideoBtn").onclick = async () => {
      if (!lastVideoBlob) return;
      const ext = lastVideoMime.includes("mp4") ? "mp4" : "webm";
      const file = new File([lastVideoBlob], `passaparola_tv.${ext}`, { type: lastVideoMime });
      if (navigator.share && (!navigator.canShare || navigator.canShare({ files: [file] }))) {
        try { await navigator.share({ files: [file], title: "Passaparola TV" }); } catch (e) {}
      } else showToast("Cihaza İndir veya Yeni Sekmede Aç kullanın");
    };
    $("openTabVideoBtn").onclick = () => { if (lastVideoUrl) window.open(lastVideoUrl, "_blank"); };

    $("editBtn").onclick = () => {
      const list = $("editorList"); list.innerHTML = "";
      items.forEach((it, idx) => {
        const div = document.createElement("div");
        div.className = "editor-item" + (it.active ? "" : " disabled-letter");
        div.innerHTML = `<div class="editor-top"><span class="editor-letter">${it.letter} HARFİ</span><label class="check-label"><input type="checkbox" data-i="${idx}" class="chk" ${it.active ? "checked" : ""}/> Aktif</label></div>
          <textarea class="modal-textarea qi" data-i="${idx}">${it.q}</textarea>
          <input class="modal-input ai" data-i="${idx}" value="${it.a.replace(/"/g, "&quot;")}"/>`;
        list.appendChild(div);
      });
      $("editorModal").classList.add("open");
    };
    $("closeEditorBtn").onclick = () => $("editorModal").classList.remove("open");
    $("saveEditorBtn").onclick = () => {
      $("editorList").querySelectorAll(".qi").forEach(el => items[+el.dataset.i].q = el.value.trim());
      $("editorList").querySelectorAll(".ai").forEach(el => items[+el.dataset.i].a = el.value.trim());
      $("editorList").querySelectorAll(".chk").forEach(el => items[+el.dataset.i].active = el.checked);
      saveQuestions(items); currentIndex = 0; answerVisible = false; $("editorModal").classList.remove("open"); renderAll(); showToast("Kaydedildi");
    };
    $("resetDefaultQBtn").onclick = () => { items = cloneDefaults(); saveQuestions(items); statuses = {}; currentIndex = 0; $("editBtn").click(); renderAll(); showToast("Varsayılan 23 soru yüklendi"); };

    $("pdfBtn").onclick = () => {
      if (!window.jspdf) { showToast("PDF yüklenemedi"); return; }
      const { jsPDF } = window.jspdf, doc = new jsPDF({ unit: "mm", format: "a4" }), active = getActiveItems();
      let y = 12, page = 0;
      const addHead = () => {
        if (page > 0) doc.addPage(); page++; y = 12;
        const c = document.createElement("canvas"); c.width = 1400; c.height = 90;
        const x = c.getContext("2d"); x.fillStyle = "#0f172a"; x.fillRect(0, 0, 1400, 90);
        x.fillStyle = "#fbbf24"; x.font = "bold 36px sans-serif"; x.fillText(`PASSAPAROLA — ÖĞRETMEN SORU & CEVAP (Sayfa ${page})`, 24, 56);
        doc.addImage(c.toDataURL("image/png"), "PNG", 12, y, 186, 12); y += 15;
      };
      addHead();
      active.forEach(it => {
        if (y > 272) addHead();
        const c = document.createElement("canvas"); c.width = 1400; c.height = 84;
        const x = c.getContext("2d"); x.fillStyle = "#f8fafc"; x.fillRect(0, 0, 1400, 84);
        x.fillStyle = "#1e3a8a"; x.fillRect(0, 0, 76, 84);
        x.fillStyle = "#fbbf24"; x.font = "900 36px sans-serif"; x.textAlign = "center"; x.fillText(it.letter, 38, 54);
        x.fillStyle = "#0f172a"; x.font = "bold 24px sans-serif"; x.textAlign = "left";
        x.fillText((it.q || "").slice(0, 82), 92, 34);
        if ((it.q || "").length > 82) x.fillText(it.q.slice(82, 164), 92, 66);
        x.fillStyle = "#047857"; x.font = "bold 24px sans-serif"; x.textAlign = "right";
        x.fillText(`Cevap: ${it.a || "-"}`, 1380, 50);
        doc.addImage(c.toDataURL("image/png"), "PNG", 12, y, 186, 11.2); y += 12.8;
      });
      doc.save("Ogretmenler_Passaparola_Soru_Cevap.pdf");
      showToast("PDF indirildi!");
    };

    window.addEventListener("keydown", (e) => { if (!["INPUT", "TEXTAREA"].includes(document.activeElement.tagName) && e.key.toLowerCase() === "h") toggleClean(); });
    if (window.ResizeObserver) new ResizeObserver(layoutWheel).observe($("stageZone"));
    window.addEventListener("resize", layoutWheel);
    renderAll();
  </script>
</body>
</html>
